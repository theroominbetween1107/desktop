* {

html,

    height: 100%;
    overflow: hidden;
    background: #000;
}

body {

    color: #c0c0c0;
}

.window {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
}

.terminal {
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 10px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.35;
    cursor: text;
}

.line {
    margin: 0;
}

.command-line {
    display: flex;
    width: 100%;
}

.prompt {
    white-space: pre;
}

.input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #c0c0c0;
    font-family: "Courier New", monospace;
    font-size: 15px;
    padding: 0;
    margin: 0;
    caret-color: #c0c0c0;
}

.error {
    color: #ff5555;
}
</style>

const commands = {

    help: "Displays a list of available commands.",
    dir: "Lists files and folders in the current directory.",
    cd: "Changes the current directory.",
    type: "Displays the contents of a text file.",

    date: "Displays the current date.",
    time: "Displays the current time.",
    clear: "Clears the screen.",
    exit: "Closes the command prompt."

};


function print(text = "", className = "") {

    const div = document.createElement("div");

    div.className = "line " + className;

    div.textContent = text;

    output.appendChild(div);

    terminal.scrollTop = terminal.scrollHeight;

}


function updatePrompt() {

    prompt.textContent = currentPath + ">";

}


function normalizePath(path) {

    if (!path) {
        return currentPath;
    }

    path = path.replace(/\//g, "\\");


    if (path.toUpperCase() === "C:") {
        return "C:\\";
    }


    if (path === "\\") {
        return "C:\\";
    }


    if (path.toUpperCase().startsWith("C:\\")) {

        const parts = path.split("\\");
        const resolved = [];

        for (const part of parts) {

            if (!part || part === ".") {
                continue;
            }

            if (part === "..") {

                if (resolved.length > 0) {
                    resolved.pop();
                }

            } else {

                resolved.push(part);

            }

        }

        return "C:\\" + resolved.join("\\");
    }


    let baseParts =
        currentPath.split("\\").filter(Boolean);

    const targetParts =
        path.split("\\");


    for (const part of targetParts) {

        if (!part || part === ".") {
            continue;
        }


        if (part === "..") {

            if (baseParts.length > 1) {
                baseParts.pop();
            }

        } else {

            baseParts.push(part);

        }

    }


    return "C:\\" +
        baseParts.slice(1).join("\\");
}


function getEntry(path) {

    return filesystem[path];

}


function findChildName(entry, name) {

    if (!entry || !entry.children) {
        return null;
    }


    if (entry.children[name]) {
        return name;
    }


    const lowerName =
        name.toLowerCase();


    for (const childName of Object.keys(entry.children)) {

        if (childName.toLowerCase() === lowerName) {
            return childName;
        }

    }


    return null;

}


function showHelp() {

    print("");
    print("Available commands:");
    print("");


    Object.entries(commands).forEach(([command, description]) => {

        print(
            "  " +
            command.padEnd(8) +
            " - " +
            description
        );

    });


    print("");
    print("Type a command followed by ENTER.");
    print("");

}


function showDirectory() {

    const entry =
        getEntry(currentPath);


    if (!entry || entry.type !== "dir") {

        print(
            "The system cannot find the path specified.",
            "error"
        );

        return;
    }


    print("");
    print(" Directory of " + currentPath);
    print("");


    Object.entries(entry.children).forEach(([name, item]) => {

        if (item.type === "dir") {

            print(
                " <DIR>          " +
                name
            );

        } else {

            print(
                "                " +
                name
            );

        }

    });


    print("");

}


function changeDirectory(target) {

    if (!target) {

        print(currentPath);

        return;
    }


    const newPath =
        normalizePath(target);


    const entry =
        getEntry(newPath);


    if (!entry || entry.type !== "dir") {

        print(
            "The system cannot find the path specified.",
            "error"
        );

        return;
    }


    currentPath = newPath;

    updatePrompt();

}


function typeFile(filename) {

    if (!filename) {

        print(
            "The syntax of the command is incorrect.",
            "error"
        );

        return;
    }


    const entry =
        getEntry(currentPath);


    if (!entry || !entry.children) {

        print(
            "The system cannot find the file specified.",
            "error"
        );

        return;
    }


    const realName =
        findChildName(entry, filename);


    if (!realName) {

        print(
            "The system cannot find the file specified.",
            "error"
        );

        return;
    }


    const file =
        entry.children[realName];


    if (file.type === "dir") {

        print(
            "Access is denied.",
            "error"
        );

        return;
    }


    print("");

    print(file.content);

}


function findFiles(filename) {

    if (!filename) {

        print(
            "The syntax of the command is incorrect.",
            "error"
        );

        return;
    }


    const results = [];

    const searchName =
        filename.toLowerCase();


    Object.keys(filesystem).forEach(path => {

        const entry =
            filesystem[path];


        if (!entry.children) {
            return;
        }


        Object.keys(entry.children).forEach(name => {

            if (name.toLowerCase() === searchName) {

                const fullPath =
                    path === "C:\\"
                        ? "C:\\" + name
                        : path + "\\" + name;


                results.push(fullPath);

            }

        });

    });


    if (results.length === 0) {

        print(
            "File not found.",
            "error"
        );

        return;
    }


    print("");


    results.forEach(path => {
        print(path);
    });


    print("");

}


function executeCommand(rawCommand) {

    const trimmed =
        rawCommand.trim();


    if (!trimmed) {
        return;
    }


    commandHistory.push(trimmed);

    historyIndex =
        commandHistory.length;


    print(
        currentPath +
        ">" +
        trimmed
    );


    const parts =
        trimmed.split(/\s+/);


    const command =
        parts[0].toLowerCase();


    const args =
        trimmed
            .substring(parts[0].length)
            .trim();


    switch (command) {

        case "help":

            showHelp();

            break;


        case "dir":

            showDirectory();

            break;


        case "cd":

            changeDirectory(args);

            break;


        case "type":

            typeFile(args);

            break;


        case "pwd":

            print(currentPath);

            break;


        case "find":

            findFiles(args);

            break;


        case "cls":
        case "clear":

            output.innerHTML = "";

            break;


        case "echo":

            print(args);

            break;


        case "whoami":

            print("birthday");

            break;


        case "date":

            print(
                new Date()
                    .toLocaleDateString()
            );

            break;


        case "time":

            print(
                new Date()
                    .toLocaleTimeString()
            );

            break;


        case "exit":

            window.close();

            break;


        default:

            print(
                "'" +
                command +
                "' is not recognized as an internal or external command,",
                "error"
            );

            print(
                "operable program or batch file.",
                "error"
            );

            break;

    }


    terminal.scrollTop =
        terminal.scrollHeight;

}


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            executeCommand(
                input.value
            );

            input.value = "";

            return;
        }


        if (event.key === "ArrowUp") {

            if (commandHistory.length === 0) {
                return;
            }


            historyIndex =
                Math.max(
                    0,
                    historyIndex - 1
                );


            input.value =
                commandHistory[
                    historyIndex
                ];


            event.preventDefault();

            return;
        }


        if (event.key === "ArrowDown") {

            if (commandHistory.length === 0) {
                return;
            }


            historyIndex =
                Math.min(
                    commandHistory.length,
                    historyIndex + 1
                );


            input.value =
                historyIndex === commandHistory.length
                    ? ""
                    : commandHistory[
                        historyIndex
                    ];


            event.preventDefault();

        }

    }
);

window.addEventListener("load", function() {

  backgroundMusic.play().then(function() {

    let volume = 0;

    const fadeIn = setInterval(function() {

      volume += 0.01;

      backgroundMusic.volume = Math.min(volume, 0.25);

      if (volume >= 0.25) {
        clearInterval(fadeIn);
      }

    }, 100);

  }).catch(function(error) {

    console.log("Music failed to play:", error);

  });

});
