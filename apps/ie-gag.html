<!DOCTYPE html>
<html>

<head>

  <title>Internet Explorer</title>

  <style>

    @font-face {
      font-family: "MS Sans Serif";
      src: url("../fonts/MS_Sans_Serif.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      font-family: "MS Sans Serif", Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    h2 {
      font-size: 18px;
      margin: 10px;
    }

    p {
      font-size: 12px;
    }

  </style>

</head>

<body>

  <div class="container">

    <!-- PUT YOUR IMAGE DIRECTORY HERE -->
    <img src="../media/idiot.png">

    <h2>WELCOME TO THE INTERNET!</h2>

    <p>Have a nice day.</p>

  </div>

</body>

</html>
