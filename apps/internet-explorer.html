<!DOCTYPE html>
<html>
<head>
  <title>Internet Explorer</title>

  <style>
    @font-face {
      font-family: "MS Sans Serif";
      src: url("../fonts/MS_Sans_Serif.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      font-family: "MS Sans Serif", Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c0c0c0;
    }

    .browser {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .menu {
      height: 25px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding-left: 6px;
      font-size: 12px;
    }

    .toolbar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-top: 1px solid white;
      border-bottom: 2px solid #808080;
    }

    .toolbar button {
      height: 30px;
      min-width: 35px;
      background: #c0c0c0;
      border: 2px solid;
      border-color: white #808080 #808080 white;
    }

    .toolbar button:active {
      border-color: #808080 white white #808080;
    }

    .address {
      flex: 1;
      height: 25px;
      background: white;
      border: 2px solid #808080;
      padding: 3px 6px;
      font-size: 12px;
    }

    .page {
      flex: 1;
      margin: 4px;
      background: white;
      border: 2px solid #808080;
      text-align: center;
      padding-top: 25px;
    }

    .page img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    h1 {
      font-size: 22px;
      margin: 8px;
    }

    p {
      font-size: 13px;
    }

    .start-button {
      margin-top: 15px;
      padding: 5px 18px;
    }
  </style>
</head>

<body>

  <div class="browser">

    <div class="menu">
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Favorites</span>
      <span>Tools</span>
      <span>Help</span>
    </div>

    <div class="toolbar">

      <button>◀</button>
      <button>▶</button>
      <button>↻</button>
      <button>⌂</button>

      <div class="address">
        http://www.blingoblizzard.com
      </div>

      <button>Go</button>

    </div>

    <div class="page">

      <img src="../media/idiot.png">

      <h1>Internet Explorer</h1>

      <p>Welcome to the Internet.</p>

      <button class="start-button" id="browseButton">
        Browse the Internet
      </button>

    </div>

  </div>

  <audio id="gagAudio" src="../media/you-are-an-idiot.mp3"></audio>

  <script src="ie.js"></script>

</body>
</html>
